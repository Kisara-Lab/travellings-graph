<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开往网络图谱</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, sans-serif; }
        svg { width: 100vw; height: 100vh; display: block; }
        .link { stroke: #2a3a5c; stroke-opacity: 0.6; }
        .node circle { cursor: pointer; stroke: #fff; stroke-width: 1.2; }
        .node circle:hover { stroke-width: 2.5; }
        .tooltip {
            position: absolute; background: rgba(20,25,40,0.95);
            border: 1px solid #3a4a6c; border-radius: 6px;
            padding: 8px 12px; color: #e0e6f0; font-size: 13px;
            pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
        .tooltip .name { font-weight: bold; margin-bottom: 3px; }
        .tooltip .domain { color: #8899bb; font-size: 12px; }
        .stats {
            position: fixed; top: 16px; right: 16px;
            background: rgba(20,25,40,0.9); border: 1px solid #3a4a6c;
            border-radius: 8px; padding: 12px 16px; color: #c0ccee; font-size: 13px;
        }
        .stats h3 { color: #7ecfff; margin-bottom: 6px; font-size: 14px; }
        .stats p { margin: 3px 0; }
    </style>
</head>
<body>
    <div style="position:fixed;top:16px;left:16px;z-index:100;"><a href="index.html" style="color:#7ecfff;text-decoration:none;margin:0 8px;padding:4px 10px;border:1px solid #3a4a6c;border-radius:4px;font-size:12px;background:rgba(20,25,40,0.9);">力导向图</a><a href="dashboard.html" style="color:#7ecfff;text-decoration:none;margin:0 8px;padding:4px 10px;border:1px solid #3a4a6c;border-radius:4px;font-size:12px;background:rgba(20,25,40,0.9);">数据分析</a><a href="external.html" style="color:#7ecfff;text-decoration:none;margin:0 8px;padding:4px 10px;border:1px solid #3a4a6c;border-radius:4px;font-size:12px;background:rgba(20,25,40,0.9);">外链图谱</a><a href="orgs.html" style="color:#7ecfff;text-decoration:none;margin:0 8px;padding:4px 10px;border:1px solid #3a4a6c;border-radius:4px;font-size:12px;background:rgba(20,25,40,0.9);">组织生态</a></div>
    <div class="tooltip" id="tooltip"></div>
    <div class="stats" id="stats"></div>
    <svg id="graph"></svg>
    <script>
    (async function() {
        const [nodes, edges] = await Promise.all([
            fetch('./output/nodes.json').then(r => r.json()),
            fetch('./output/edges.json').then(r => r.json())
        ]);

        const width = window.innerWidth;
        const height = window.innerHeight;

        // 统计
        const avgDegree = nodes.length > 0 ? (edges.length * 2 / nodes.length).toFixed(2) : 0;
        document.getElementById('stats').innerHTML =
            '<h3>开往网络图谱</h3>' +
            '<p>节点数: ' + nodes.length + '</p>' +
            '<p>边数: ' + edges.length + '</p>' +
            '<p>平均度数: ' + avgDegree + '</p>';

        // 颜色按 tag 分组
        const tags = [...new Set(nodes.map(n => (n.tag || '').split('.')[0] || 'other'))];
        const color = d3.scaleOrdinal(d3.schemeTableau10).domain(tags);

        // 节点度数
        const degree = {};
        edges.forEach(e => {
            degree[e.source] = (degree[e.source] || 0) + 1;
            degree[e.target] = (degree[e.target] || 0) + 1;
        });

        const svg = d3.select('#graph');
        const g = svg.append('g');

        // 缩放
        svg.call(d3.zoom().scaleExtent([0.1, 8]).on('zoom', e => {
            g.attr('transform', e.transform);
        }));

        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(edges).id(d => d.id).distance(60))
            .force('charge', d3.forceManyBody().strength(-120))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(8));

        const link = g.append('g')
            .selectAll('line')
            .data(edges)
            .join('line')
            .attr('class', 'link')
            .attr('stroke-width', 1);

        const node = g.append('g')
            .selectAll('g')
            .data(nodes)
            .join('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
            );

        node.append('circle')
            .attr('r', d => Math.max(3, Math.sqrt(degree[d.id] || 1) * 3))
            .attr('fill', d => color((d.tag || '').split('.')[0] || 'other'))
            .attr('opacity', 0.85);

        // Tooltip
        const tooltip = d3.select('#tooltip');
        node.on('mouseover', (e, d) => {
            tooltip.style('opacity', 1)
                .html('<div class="name">' + d.name + '</div><div class="domain">' + d.id + '</div>');
        })
        .on('mousemove', e => {
            tooltip.style('left', (e.pageX + 12) + 'px').style('top', (e.pageY - 20) + 'px');
        })
        .on('mouseout', () => tooltip.style('opacity', 0))
        .on('click', (e, d) => {
            window.open('https://' + d.id, '_blank');
        });

        simulation.on('tick', () => {
            link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
            node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
        });
    })();
    </script>
    <div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#8a9ab5;font-size:12px;z-index:100;background:rgba(20,25,40,0.9);padding:4px 12px;border-radius:4px;border:1px solid #3a4a6c;">数据采集日期：2026-06-06 | 数据来源：开往 API + 成员站点实时爬取分析</div>
</body>
</html>
